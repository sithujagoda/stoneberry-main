services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gem-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - gem_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gem-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gem_network

networks:
  gem_network:
    driver: bridge
